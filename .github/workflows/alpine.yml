name: Alpine Linux
on:
  - push
  - pull_request

jobs:
  build:
    name: Build on Alpine ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - x86
          - aarch64
          - armv7
          - ppc64le
          - riscv64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install extra dependencies
        run: |
          sudo apt update && sudo apt install -y binfmt-support
      - name: Install Alpine Linux for ${{ matrix.arch }}
        uses: jirutka/setup-alpine@v1
        with:
          arch: ${{ matrix.arch }}
          # Pin away from latest-stable: apk-tools 3 (Alpine 3.24+) has been
          # corrupting the package DB under QEMU for several arches (ppc64le).
          # riscv64 still needs edge for package availability.
          branch: ${{ matrix.arch == 'riscv64' && 'edge' || 'v3.20' }}
          packages: >
            build-base
            cmake
            g++
            linux-headers
            git
            bash
            zlib-dev
            binutils
      - name: Prepare
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
        shell: alpine.sh {0}
      - name: Build
        run: |
          cmake --build build -j$(nproc)
        shell: alpine.sh {0}
      - name: Test
        run: |
          ctest --test-dir build --output-on-failure
        shell: alpine.sh {0}
