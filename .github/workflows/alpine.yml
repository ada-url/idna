name: Alpine Linux
on:
  - push
  - pull_request

jobs:
  build:
    name: Build on Alpine ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch:
          - x86_64
          - x86
          - aarch64
          - armv7
          - ppc64le
          - riscv64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v1
      - name: Install extra dependencies
        run: |
          sudo apt update && sudo apt install -y binfmt-support
      - name: Install latest Alpine Linux for ${{ matrix.arch }}
        uses: jirutka/setup-alpine@v1
        with:
          arch: ${{ matrix.arch }}
          branch: ${{ matrix.arch == 'riscv64' && 'edge' || 'latest-stable' }}
          # The action's default apk-tools v2 creates a database that apk-tools v3
          # (Alpine >= 3.24) cannot read on ppc64le.
          apk-tools-url: https://gitlab.alpinelinux.org/api/v4/projects/5/packages/generic/v3.0.8/x86_64/apk.static#!sha256!11758d76de3699c7606152357f415f55879743ccf0e3d8942d5ba98cf29a3c86
          packages: >
            build-base
            cmake
            g++
            linux-headers
            git
            bash
            build-base
      - name: Prepare
        run: |
          cmake -B build
        shell: alpine.sh {0}
      - name: Build
        run: |
          cmake --build build
        shell: alpine.sh {0}
      - name: Test
        run: |
          ctest --test-dir build --output-on-failure 
        shell: alpine.sh {0}