name: Alpine Linux
on:
  - push
  - pull_request

jobs:
  build:
    name: Build on Alpine ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - x86
          - aarch64
          - armv7
          - ppc64le
          - riscv64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install extra dependencies
        run: |
          sudo apt update && sudo apt install -y binfmt-support
      - name: Install latest Alpine Linux for ${{ matrix.arch }}
        uses: jirutka/setup-alpine@v1
        with:
          arch: ${{ matrix.arch }}
          branch: ${{ matrix.arch == 'riscv64' && 'edge' || 'latest-stable' }}
          # Keep the initial package set small; setup-alpine has been flaky when
          # installing a long list (apk database "file format is invalid").
          packages: build-base
      - name: Install build packages
        run: |
          # Retry once: Alpine QEMU images occasionally race the apk db.
          for attempt in 1 2 3; do
            apk update && apk add --no-cache \
              cmake g++ linux-headers git bash zlib-dev binutils \
              && break
            echo "apk add failed (attempt $attempt), retrying..."
            sleep 2
          done
          command -v cmake
          command -v g++
        shell: alpine.sh {0}
      - name: Prepare
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
        shell: alpine.sh {0}
      - name: Build
        run: |
          cmake --build build -j$(nproc)
        shell: alpine.sh {0}
      - name: Test
        run: |
          ctest --test-dir build --output-on-failure
        shell: alpine.sh {0}
